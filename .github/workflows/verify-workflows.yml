name: connect to tailscale and check backups
run-name: Check Backups
on: push


jobs: 

   AuthToTailscale:
    runs-on: ubuntu-latest
    steps: 
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

