name: connect to tailscale and check backups
run-name: Check Backups
on: workflow_dispatch
# technically this should only be on pull request approved and do it from main


jobs: 

   DeployDockerCompose:
    runs-on: ubuntu-latest
    steps: 
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: copy files over ssh
        env: 
          USER_PASSWORD: ${{ secrets.password}}
        run: | 
          tailscale ssh lucassimpson@hpdesktop
          echo "ok automated"

