---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Ensure target user exists for dotfile rendering
      ansible.builtin.user:
        name: hyprtest
        shell: /bin/bash
        create_home: true
        state: present

    - name: Apply hyprland role with test values
      ansible.builtin.include_role:
        name: danmwallace.fedora.hyprland
      vars:
        hyprland_user: hyprtest
        hyprland_theme: nord
